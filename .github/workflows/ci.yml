name: CI
on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ vars.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env file for tests
        run: |
          echo "DATABASE_URL=file:./data/sqlite.db" > .env
          echo "JWT_SECRET=test-secret-key" >> .env

      - name: Create data directory for SQLite
        run: mkdir -p apps/backend/data

      - name: TypeScript type check (backend only)
        run: pnpm --filter @ledgerly/backend ts-check

      - name: Run linting (backend only)
        run: pnpm --filter @ledgerly/backend lint

      - name: Run tests (backend only)
        run: pnpm --filter @ledgerly/backend test

      - name: Build projects (backend only)
        run: pnpm --filter @ledgerly/backend build
